<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A virtual playground for digital projects exploring AI."
    />
    <title>AI Playground · Teo Peter</title>
    <link rel="stylesheet" href="playground.css" />
  </head>
  <body>
    <main
      class="playground-stage"
      aria-label="A virtual playground for digital projects exploring AI"
    >
      <header class="playground-header">
        <h1 id="playground-title">This is my virtual playground for all digital projects that I am currently doing to learn and integrate AI in my workflow.</h1>
      </header>
      <div class="playground-item playground-folder" data-x="0.14" data-y="0.52" data-vx="54" data-vy="42">
        Project 1 is<br />Coming soon™
      </div>
      <div class="playground-item playground-folder" data-x="0.76" data-y="0.56" data-vx="-48" data-vy="52">
        Project 2 is<br />Coming soon™
      </div>
      <a
        class="playground-item playground-tool"
        href="Logo3D.html"
        target="_blank"
        rel="noopener"
        aria-label="Open the 2D to 3D tool in a new window"
        data-x="0.44"
        data-y="0.2"
        data-vx="42"
        data-vy="-46"
        data-change-color="false"
      >
        <img src="2dto3d.png" alt="2D to 3D tool" />
      </a>
      <div
        class="playground-item playground-model"
        role="img"
        aria-label="Rotating 3D model"
        data-x="0.47"
        data-y="0.55"
        data-vx="62"
        data-vy="-38"
        data-change-color="false"
      >
        <canvas aria-hidden="true"></canvas>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
    <script src="3d-model-data.js"></script>
    <script src="playground.js"></script>
  </body>
</html>
