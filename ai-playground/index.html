<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A small place on my web where I test ideas and show projects."
    />
    <title>Playground · Teo Peter</title>
    <link rel="stylesheet" href="playground.css" />
    <script src="backgrounds.js"></script>
    <script>
      // Pick a random wallpaper from backgrounds/ before the page paints.
      (function () {
        var list = window.playgroundBackgrounds || [];
        if (!list.length) return;
        var pick = list[Math.floor(Math.random() * list.length)];
        window.playgroundWallpaper = pick;
        document.documentElement.style.setProperty("--wallpaper", 'url("' + pick + '")');
      })();
    </script>
  </head>
  <body>
    <main class="desktop" aria-label="Playground">
      <header class="desktop-bar">
        <a class="desktop-back" href="../index.html">&larr; Back to Teo Peter.work</a>
        <time class="desktop-clock" aria-live="off"></time>
      </header>

      <section class="window window-photos" aria-label="Some images I took">
        <div class="window-body">
          <div class="carousel">
            <img class="carousel-image" alt="" draggable="false" />
            <p class="carousel-caption" aria-live="polite"></p>
            <p class="carousel-empty">Photos coming soon</p>
            <button class="carousel-button carousel-prev" type="button" aria-label="Previous image">&larr;</button>
            <button class="carousel-button carousel-next" type="button" aria-label="Next image">&rarr;</button>
            <button class="carousel-set-bg" type="button" hidden>Set as background</button>
          </div>
        </div>
      </section>

      <section class="window window-note" aria-labelledby="note-title">
        <h2 class="window-title" id="note-title">Note</h2>
        <div class="window-body">
          <p class="note-text">
            Hey, welcome to the playground. This is a small place on my web where I test ideas and
            show projects I do to practice my creativity and learning new tools.
          </p>
        </div>
      </section>

      <section class="window window-apps" aria-labelledby="apps-title">
        <h2 class="window-title" id="apps-title">My Apps</h2>
        <div class="window-body">
          <ul class="app-grid">
            <li>
              <a class="app-icon" href="Logo3D.html" target="_blank" rel="noopener" title="2D to 3D">
                <img src="2dto3d.png" alt="2D to 3D tool" draggable="false" />
              </a>
            </li>
            <li>
              <span class="app-icon" title="Posta">
                <img src="posta.png" alt="Posta" draggable="false" />
              </span>
            </li>          </ul>
        </div>
      </section>

      <section class="window window-model" aria-labelledby="model-title">
        <h2 class="window-title" id="model-title">3D models</h2>
        <div class="window-body">
          <canvas aria-label="Rotating 3D model" role="img"></canvas>
        </div>
      </section>

      <section class="window window-radio" aria-labelledby="radio-title">
        <h2 class="window-title" id="radio-title">Playground Radio</h2>
        <div class="window-body">
          <p>Coming soon!</p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
    <script src="3d-model-data.js"></script>
    <script src="playground.js"></script>
  </body>
</html>
